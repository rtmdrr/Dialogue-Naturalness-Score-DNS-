[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-persona-dns"
version = "0.1.0"
description = "Dialogue Naturalness Score (DNS): reference-free evaluation of dialogue naturalness against a human baseline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dialogue evaluation", "naturalness", "role-play", "persona", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
english = ["spacy>=3.4", "nrclex>=3.0"]
hebrew = ["hepsylex>=1.0", "transformers>=4.30", "torch>=1.13"]
congruence = ["transformers>=4.30", "torch>=1.13"]
all = [
    "spacy>=3.4",
    "nrclex>=3.0",
    "hepsylex>=1.0",
    "transformers>=4.30",
    "torch>=1.13",
]
dev = ["pytest>=7.0"]

[project.scripts]
dns = "deep_persona_dns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
